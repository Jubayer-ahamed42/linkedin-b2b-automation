name: LinkedIn B2B Autonomous Client-Acquisition Poster

on:
  schedule:
    # ১. প্রাইমারি ক্লাউড রান: সকাল ৯:৩০ BST (03:30 UTC)
    - cron: '30 3 * * *'
    # ২. ক্লাউড ব্যাকআপ ১: সকাল ৯:৪৫ BST (03:45 UTC) - যদি ৯:৩০ সার্ভার কিউতে সামান্য আটকে যায়
    - cron: '45 3 * * *'
    # ৩. ক্লাউড ব্যাকআপ ২: সকাল ১০:০০ BST (04:00 UTC) - সর্বোচ্চ ক্লাউড সুরক্ষা ফেইলওভার
    - cron: '0 4 * * *'

  # এক্সটার্নাল ক্লাউড পিং বা ওয়েবহুক ট্রিগার
  repository_dispatch:
    types: [publish_linkedin_post]

  # ম্যানুয়াল রান করার সুবিধা
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ড্রাই-রান মোড (লিঙ্কডইনে পোস্ট হবে না, শুধু প্রিভিউ টেস্ট হবে)'
        required: false
        default: false
        type: boolean
      force:
        description: 'আজকে পোস্ট করা থাকলেও পুনরায় পোস্ট করতে ফোর্স করবে'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  linkedin_post:
    name: Generate & Post B2B LinkedIn Content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LinkedIn Poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          TIMEZONE: Asia/Dhaka
          PYTHONIOENCODING: utf-8
        run: |
          DRY_RUN_FLAG=""
          FORCE_FLAG=""
          
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          
          echo "Executing LinkedIn B2B Poster (Trigger: ${{ github.event_name }})"
          python main.py $DRY_RUN_FLAG $FORCE_FLAG

      - name: Commit and Push Updated LinkedIn History
        if: ${{ inputs.dry_run != true }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add linkedin_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update linkedin history [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
          else
            echo "No history changes to commit."
          fi
